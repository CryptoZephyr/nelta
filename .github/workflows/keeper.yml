name: keeper

# Free always-on keeper: each run watches for ~5h50m, and the schedule queues the next run behind it.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Require a private RPC
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          if [ -z "$RPC_URL" ]; then
            echo "::error title=RPC_URL secret missing::Set the RPC_URL repo secret to a private Devnet RPC. The public endpoint rate-limits the keeper and armed rules can be missed."
            exit 1
          fi
      - run: npm ci
      - name: Run keeper
        env:
          NELTA_KEEPER_KEYPAIR: ${{ secrets.NELTA_KEEPER_KEYPAIR }}
          RPC_URL: ${{ secrets.RPC_URL }}
        run: timeout 350m npm run worker || [ $? -eq 124 ]
